# release-plz publishes the crates to crates.io and nothing else: the single
# `v<version>` tag and GitHub release are .github/workflows/release.yml's.
# https://release-plz.dev/docs/config

[workspace]
git_tag_enable = false
git_release_enable = false
# Before 1.0 a breaking change raises the minor version by hand.
semver_check = false
# Time for the crates.io index to show one crate before the next that
# depends on it is published.
publish_timeout = "10m"
