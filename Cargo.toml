# The root is the workspace and the `cuno` package at once: the binary, and the
# `tests/` that run it. See docs/en/specs/architecture.md, "Repository layout".
[package]
name = "cuno"
# The package's own metadata. `cuno --help` prints cuno-cli's description,
# which says the same.
description = "Everything C/C++ development needs, in one tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The binary only collects the process and calls cuno-cli (see
# docs/en/specs/architecture.md, "Dependencies between crates"). The tests
# drive the crates directly too, so they take them as dev-dependencies.
[dependencies]
anstream.workspace = true
cuno-cli.workspace = true
cuno-core.workspace = true

[dev-dependencies]
cuno-build.workspace = true
cuno-manifest.workspace = true
cuno-test.workspace = true
cuno-toolchain.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[workspace]
members = ["crates/*"]
# The root is a package, so without this a plain `cargo test` would build and
# test only `cuno` and skip the crates; CI passes --workspace either way.
default-members = [".", "crates/*"]
# Explicit so that the resolver does not depend on which package's edition the
# workspace happens to read it from.
resolver = "3"

[workspace.package]
# Nothing is released before v0.1.0 (M4, docs/en/roadmap.md), so no build
# before then claims a release version.
version = "0.0.0"
edition = "2024"
# See docs/en/specs/architecture.md, "Rust".
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/itsakeyfut/cuno"
# Nothing goes to crates.io until distribution is decided (M4).
publish = false

[workspace.dependencies]
cuno-build = { path = "crates/cuno-build" }
cuno-cli = { path = "crates/cuno-cli" }
cuno-core = { path = "crates/cuno-core" }
cuno-toolchain = { path = "crates/cuno-toolchain" }
cuno-manifest = { path = "crates/cuno-manifest" }
cuno-test = { path = "crates/cuno-test" }
cuno-tools = { path = "crates/cuno-tools" }
# See docs/en/specs/architecture.md, "Main external libraries".
clap = { version = "4.6.9", features = ["derive"] }
# The binary's standard streams: escape codes shown as colours on a Windows
# console that does not take them by default. clap already depends on it.
anstream = "1.0.0"
# Reading JSON: vswhere output (cuno-toolchain) and `cargo metadata` in tests.
serde_json = "1.0.154"
# Temporary project directories in tests (tests/support).
tempfile = "3.27"
# Reading cuno.toml and config.toml (cuno-manifest): the TOML parser with
# positions, serde derive, the keys nothing read, and package versions.
toml = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
semver = "1.0.28"
# Reading where the Windows SDK is installed (cuno-toolchain, Windows only).
winreg = "0.56"

[workspace.lints.rust]
# `deny` rather than `forbid`: a small Windows integration module may need an
# explicitly allowed `unsafe` block later, and `forbid` cannot be overridden.
unsafe_code = "deny"
missing_docs = "warn"
