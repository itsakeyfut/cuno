# Checks every pull request and every push to main. One job per check, so a
# failure is visible by name and branch protection can require each by name.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs on any branch: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous push. Runs on
# main are never cancelled, so every commit on main gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  fmt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      # Dependencies and build output, keyed on the job, the exact compiler and
      # Cargo.lock: a new compiler or a changed lock file starts from scratch.
      - name: Compiler version
        id: rustc
        run: echo "version=$(rustc -V | sed 's/ /_/g')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ github.job }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  doc:
    runs-on: windows-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # Dependencies and build output, keyed on the job, the exact compiler and
      # Cargo.lock: a new compiler or a changed lock file starts from scratch.
      - name: Compiler version
        id: rustc
        run: echo "version=$(rustc -V | sed 's/ /_/g')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ github.job }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      # Private items too: most doc comments here are on them, and rustdoc
      # resolves an item's links only when it documents the item, so a
      # broken link in a private doc passes otherwise.
      - run: cargo doc --workspace --no-deps --document-private-items

  # What decides a release (.github/workflows/release.yml), tested here so
  # it is proven before a release depends on it.
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/test-release-scripts.sh

  # Every crate packaged as crates.io would receive it, and built from that
  # package alone, so a file embedded from outside its crate, or an internal
  # dependency with no version, fails before a release publishes anything
  # (docs/en/specs/architecture.md, "Repository layout"). Only a release
  # needs it: on the release pull request (the version above the last
  # release, which crates.io does not have yet) and on manual runs. Other
  # runs skip the work but still report, so a required check is satisfied.
  # Run on main's own version, cargo would take crates.io's copies of the
  # internal crates in place of the ones just packaged.
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release tags, to compare the version with.
          fetch-depth: 0
      - name: Whether this is a release
        id: release
        shell: bash
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")"
          last="$(git tag --list 'v*' | bash .github/scripts/last-release.sh)"
          # Fails when the version is lower than the last release.
          decision="$(bash .github/scripts/release-version.sh "$version" "$last")"
          package=false
          if [ "$decision" = release ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            package=true
          fi
          echo "$version against ${last:-no release}: $decision; package: $package"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - name: Install toolchain
        if: steps.release.outputs.package == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - if: steps.release.outputs.package == 'true'
        run: cargo package --workspace

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # Dependencies and build output, keyed on the job, the exact compiler and
      # Cargo.lock: a new compiler or a changed lock file starts from scratch.
      - name: Compiler version
        id: rustc
        run: echo "version=$(rustc -V | sed 's/ /_/g')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ github.job }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      # The clang the compiler tests use; see .github/actions/llvm.
      - uses: ./.github/actions/llvm
      # MinGW GCC where users have it: MSYS2's UCRT64 in the image's own
      # MSYS2, left off PATH, so the tests find it where cuno looks
      # (docs/en/specs/toolchain.md, "MinGW (GCC)"). A missing GCC fails
      # the tests on CI, as any missing compiler does.
      - name: Install MinGW GCC
        run: |
          C:/msys64/usr/bin/bash.exe -lc 'pacman -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-gcc'
          C:/msys64/ucrt64/bin/gcc.exe -dumpfullversion
      - run: cargo test --workspace --no-fail-fast

  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The MSRV is read from Cargo.toml rather than repeated here, so raising
      # `rust-version` cannot leave CI testing the old one.
      # See docs/en/specs/architecture.md, "Rust".
      - name: Install toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$msrv" || { echo "rust-version not found in Cargo.toml"; exit 1; }
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
      # Dependencies and build output, keyed on the job, the exact compiler and
      # Cargo.lock: a new compiler or a changed lock file starts from scratch.
      - name: Compiler version
        id: rustc
        run: echo "version=$(rustc -V | sed 's/ /_/g')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ github.job }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      # The MSRV is a promise about building, so every target is compiled
      # here and nothing is run: the integration tests, which start the
      # compilers, run once, in the test job.
      - run: cargo check --workspace --all-targets

  # install.ps1 as a user runs it (`irm | iex`, here from the checkout),
  # then again over it, over a PATH that already names the directory in
  # another spelling, against a wrong checksum and with a relative
  # CUNO_HOME (docs/en/specs/distribution.md, "The PowerShell one-liner"),
  # then `cuno self uninstall -y` from this branch's cuno put in its place
  # (docs/en/specs/commands.md, "`cuno self uninstall`"). The runner's user
  # PATH is put back at the end.
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # The released cuno the installer puts in place predates what this
      # branch adds, so the uninstall step runs this build instead.
      - run: cargo build --locked -p cuno
      - name: Install, reinstall, refuse a bad checksum or a relative home, then uninstall
        run: |
          $ErrorActionPreference = 'Stop'
          $saved = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $savedKind = (Get-Item HKCU:\Environment).GetValueKind('Path')
          $root = Join-Path $env:RUNNER_TEMP 'installer'
          $home_ = Join-Path $root 'home'
          $bin = Join-Path $home_ 'bin'
          function Get-UserPath { (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames') }
          function Get-Entries { @((Get-UserPath) -split ';' | Where-Object { $_.Trim().Trim('"').TrimEnd('\') -ieq $bin }) }
          # The exit code and everything printed, apart: a function's
          # output would otherwise mix the child's lines into its result.
          function Invoke-Installer([string[]]$command) {
            $ErrorActionPreference = 'Continue'
            $out = (& powershell -NoProfile @command 2>&1 | ForEach-Object { "$_" }) -join "`n"
            Write-Host $out
            [pscustomobject]@{ Code = $LASTEXITCODE; Out = $out }
          }
          try {
            $env:CUNO_HOME = $home_
            $r = Invoke-Installer @('-Command', 'Get-Content -Raw install.ps1 | iex; ''EAP='' + $ErrorActionPreference')
            if ($r.Code -ne 0) { throw 'the install through iex failed' }
            if ($r.Out -notmatch 'EAP=Continue') { throw 'iex left the session with another error preference' }
            $version = & (Join-Path $bin 'cuno.exe') --version
            if ($version -notmatch '^cuno \d+\.\d+\.\d+') { throw "unexpected --version: $version" }
            if ((Get-Entries).Count -ne 1) { throw "PATH holds $bin $((Get-Entries).Count) times after one install" }

            $r = Invoke-Installer @('-File', 'install.ps1')
            if ($r.Code -ne 0) { throw 'the second install failed' }
            if ((Get-Entries).Count -ne 1) { throw "PATH holds $bin $((Get-Entries).Count) times after two installs" }
            if (Test-Path (Join-Path $bin 'cuno.exe.old')) { throw 'cuno.exe.old was left behind' }

            # A REG_SZ value without the directory: appended, type kept.
            $other = ((Get-UserPath) -split ';' | Where-Object { $_ -and $_.TrimEnd('\') -ine $bin }) -join ';'
            Set-ItemProperty HKCU:\Environment -Name Path -Value $other -Type String
            $r = Invoke-Installer @('-File', 'install.ps1')
            if ($r.Code -ne 0) { throw 'the install into a REG_SZ PATH failed' }
            if ((Get-Entries).Count -ne 1) { throw "PATH holds $bin $((Get-Entries).Count) times after an install into REG_SZ" }
            if ((Get-Item HKCU:\Environment).GetValueKind('Path') -ne 'String') { throw 'the REG_SZ Path changed type' }

            # The directory already there, quoted, with `/` and a trailing
            # separator: nothing appended.
            $spelled = '"' + $bin.Replace('\', '/') + '/"'
            Set-ItemProperty HKCU:\Environment -Name Path -Value "$other;$spelled" -Type String
            $r = Invoke-Installer @('-File', 'install.ps1')
            if ($r.Code -ne 0) { throw 'the install over another spelling failed' }
            if ((Get-UserPath) -ne "$other;$spelled") { throw "PATH changed though it named ${bin}: $(Get-UserPath)" }

            $v = $version -replace '^cuno (\S+).*', '$1'
            $zip = "cuno-$v-x86_64-pc-windows-msvc.zip"
            $rel = Join-Path $root "rel\download\v$v"
            New-Item -ItemType Directory -Force $rel | Out-Null
            & "$env:SystemRoot\System32\curl.exe" -fsSL -o (Join-Path $rel $zip) "https://github.com/itsakeyfut/cuno/releases/download/v$v/$zip"
            Set-Content (Join-Path $rel "$zip.sha256") ('0' * 64 + "  $zip")
            $before = (Get-Item (Join-Path $bin 'cuno.exe')).LastWriteTimeUtc
            $url = 'file:///' + (Join-Path $root 'rel').Replace('\', '/')
            $r = Invoke-Installer @('-File', 'install.ps1', '-Version', $v, '-Releases', $url)
            if ($r.Code -eq 0 -or $r.Out -notmatch 'does not match its checksum') { throw 'a bad checksum was not refused for its checksum' }
            if ((Get-Item (Join-Path $bin 'cuno.exe')).LastWriteTimeUtc -ne $before) { throw 'a bad checksum replaced cuno.exe' }
            if (Get-ChildItem ([IO.Path]::GetTempPath()) -Filter 'cuno-install-*') { throw 'a temporary directory was left behind' }

            $env:CUNO_HOME = 'relative\home'
            $r = Invoke-Installer @('-Command', 'Get-Content -Raw install.ps1 | iex')
            if ($r.Code -eq 0 -or $r.Out -notmatch 'CUNO_HOME must be an absolute path') { throw 'a relative CUNO_HOME was not refused' }
            if (Test-Path 'relative') { throw 'a relative CUNO_HOME created something' }

            # This branch's cuno, where the installer put the released one.
            $env:CUNO_HOME = $home_
            Copy-Item -Force target\debug\cuno.exe (Join-Path $bin 'cuno.exe')
            $r = Invoke-Installer @('-Command', "& '$(Join-Path $bin 'cuno.exe')' self uninstall -y")
            if ($r.Code -ne 0) { throw 'self uninstall failed' }
            $gone = $false
            for ($i = 0; $i -lt 40; $i++) {
              if (-not (Test-Path $home_)) { $gone = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $gone) { throw "$home_ is still there after self uninstall" }
            if ((Get-UserPath) -ne $other) { throw "PATH still names ${bin} after self uninstall: $(Get-UserPath)" }
          } finally {
            Set-ItemProperty HKCU:\Environment -Name Path -Value $saved -Type $savedKind
          }
          # The runner ends the step with the last native exit code, which
          # is the refused install's 1; reaching here means every check held.
          $global:LASTEXITCODE = 0
