# Checks every pull request and every push to main. One job per check, so a
# failure is visible by name and branch protection can require each by name.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs on any branch: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous push. Runs on
# main are never cancelled, so every commit on main gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  fmt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      # Dependencies and build output, keyed on the job, the exact compiler and
      # Cargo.lock: a new compiler or a changed lock file starts from scratch.
      - name: Compiler version
        id: rustc
        run: echo "version=$(rustc -V | sed 's/ /_/g')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ github.job }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  doc:
    runs-on: windows-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # Dependencies and build output, keyed on the job, the exact compiler and
      # Cargo.lock: a new compiler or a changed lock file starts from scratch.
      - name: Compiler version
        id: rustc
        run: echo "version=$(rustc -V | sed 's/ /_/g')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ github.job }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo doc --workspace --no-deps

  # What decides a release (.github/workflows/release.yml), tested here so
  # it is proven before a release depends on it.
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/test-release-scripts.sh

  # Every crate packaged as crates.io would receive it, and built from that
  # package alone, so a file embedded from outside its crate, or an internal
  # dependency with no version, fails before a release publishes anything
  # (docs/en/specs/architecture.md, "Repository layout"). Only a release
  # needs it: on the release pull request (the version above the last
  # release, which crates.io does not have yet) and on manual runs. Other
  # runs skip the work but still report, so a required check is satisfied.
  # Run on main's own version, cargo would take crates.io's copies of the
  # internal crates in place of the ones just packaged.
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release tags, to compare the version with.
          fetch-depth: 0
      - name: Whether this is a release
        id: release
        shell: bash
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")"
          last="$(git tag --list 'v*' | bash .github/scripts/last-release.sh)"
          # Fails when the version is lower than the last release.
          decision="$(bash .github/scripts/release-version.sh "$version" "$last")"
          package=false
          if [ "$decision" = release ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            package=true
          fi
          echo "$version against ${last:-no release}: $decision; package: $package"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - name: Install toolchain
        if: steps.release.outputs.package == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - if: steps.release.outputs.package == 'true'
        run: cargo package --workspace

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # Dependencies and build output, keyed on the job, the exact compiler and
      # Cargo.lock: a new compiler or a changed lock file starts from scratch.
      - name: Compiler version
        id: rustc
        run: echo "version=$(rustc -V | sed 's/ /_/g')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ github.job }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      # The clang the compiler tests use; see .github/actions/llvm.
      - uses: ./.github/actions/llvm
      # MinGW GCC where users have it: MSYS2's UCRT64 in the image's own
      # MSYS2, left off PATH, so the tests find it where cuno looks
      # (docs/en/specs/toolchain.md, "MinGW (GCC)"). A missing GCC fails
      # the tests on CI, as any missing compiler does.
      - name: Install MinGW GCC
        run: |
          C:/msys64/usr/bin/bash.exe -lc 'pacman -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-gcc'
          C:/msys64/ucrt64/bin/gcc.exe -dumpfullversion
      - run: cargo test --workspace --no-fail-fast

  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The MSRV is read from Cargo.toml rather than repeated here, so raising
      # `rust-version` cannot leave CI testing the old one.
      # See docs/en/specs/architecture.md, "Rust".
      - name: Install toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$msrv" || { echo "rust-version not found in Cargo.toml"; exit 1; }
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
      # Dependencies and build output, keyed on the job, the exact compiler and
      # Cargo.lock: a new compiler or a changed lock file starts from scratch.
      - name: Compiler version
        id: rustc
        run: echo "version=$(rustc -V | sed 's/ /_/g')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ github.job }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      # The MSRV is a promise about building, so every target is compiled
      # here and nothing is run: the integration tests, which start the
      # compilers, run once, in the test job.
      - run: cargo check --workspace --all-targets
