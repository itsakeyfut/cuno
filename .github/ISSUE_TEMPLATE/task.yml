name: Task
description: A unit of work inside a milestone, filed with that milestone's batch or discovered while implementing it.
title: "feat: "
labels: ["T-Feat"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are filed a milestone at a time, as one coherent batch taken from
        the roadmap (`docs/ja/roadmap.md`, English translation in
        `docs/en/roadmap.md`). More get filed as implementing the milestone turns
        up work that was not foreseen. Milestones are worked strictly in order.

        That is what keeps an issue from becoming a second, drifting copy of the
        roadmap: the batch's lifetime is the milestone's. A backlog with no such
        bound drifts, and two copies of one thing end up disagreeing.

        Set the milestone (`M0` to `M10`). Each milestone's description carries
        the condition that completes it, so "is this finished" is a fact GitHub
        can answer. An issue may belong to a later milestone than the one being
        worked on; it waits.

        Add one status label when you file this, and it is a judgement rather
        than a default: `S-Needs-Design` if anything about how to build it is
        still open, `S-Ready-For-Implementation` if it is small and the design is
        already settled. When in doubt it is the first, because finding nothing
        to decide in design costs a few minutes, while discovering a decision
        mid-implementation means it gets made by whoever happened to be typing.

  - type: input
    id: milestone
    attributes:
      label: Milestone and roadmap line
      description: Which milestone this belongs to, and which line of the roadmap it expands.
      placeholder: "M2: Build and run, the incremental build line"
    validations:
      required: true

  - type: dropdown
    id: origin
    attributes:
      label: Origin
      description: >
        Filed with the batch, or turned up while implementing it. Worth
        recording: how much of a milestone was unforeseen is the most useful
        thing to know when planning the next one.
      options:
        - Planned with the milestone
        - Found while implementing the milestone
    validations:
      required: true

  - type: input
    id: depends
    attributes:
      label: Depends on
      description: >
        Issues in this batch that have to land first, if any. A batch is one
        piece of work split up, so the order inside it is part of the plan.
      placeholder: "#12, #13"

  - type: textarea
    id: premise
    attributes:
      label: Premise
      description: >
        What is true in the code today that makes this needed. State something
        checkable: implementation reads the code and confirms it first, because
        a premise the code has already overtaken changes what the work is.
      placeholder: |
        `cuno build` compiles every source on every run. The build graph records
        no dependency information, so changing one header rebuilds nothing and
        changing nothing rebuilds everything.
    validations:
      required: true

  - type: textarea
    id: build
    attributes:
      label: What to build
      description: >
        The shape of it. Which crate and files, which existing pattern to
        follow, and which section of the spec (`docs/ja/specs/`) it implements.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >
        A checklist, each item checkable by someone who did not write it. Every
        one ends the work explicitly met, deferred, or relocated. That
        reconciliation is why they are written down: silence is how the seventh
        item goes missing.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: proof
    attributes:
      label: How it is proven
      description: >
        Which test or command, and what its output has to say. A guard here is
        real only when breaking the code makes a named test fail, so name the
        mutation if you already know it.
      placeholder: |
        `cargo test -p cuno-build incremental::`, plus an integration test under
        `tests/` that edits a header and rebuilds with MSVC and clang-cl.
        Dropping the header from the recorded dependencies makes the edit go
        unnoticed and fails `editing_an_included_header_rebuilds_its_sources`.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: >
        What this deliberately does not do, including which later issue or
        milestone picks it up. Scope creep is the standard failure of improving
        something, so the boundary is worth writing even when it feels obvious.

  - type: textarea
    id: decisions
    attributes:
      label: Decisions to settle first
      description: >
        Anything with two defensible answers, so it is asked before code is
        written rather than found in review. Leave empty if there are none.
